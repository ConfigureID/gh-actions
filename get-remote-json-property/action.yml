name: 'Reads a property from a remote JSON file'
description: 'Downloads the file and extracts the specified property'

# Action to read a remote JSON file and extract an specified property value from it.
# The property can be a path (nested property), separating the parts with "."
inputs:
  url:
    description: 'URL of the JSON file'
    required: true
  property:
    description: 'Property inside the JSON file to extract. Can be nested using "."'
    required: true

outputs:
  value:
    value: ${{ steps.get-property.outputs.value }}
    description: 'The value of the property inside the JSON'

runs:
  using: "composite"
  steps:
    - shell: bash
      id: get-property
      run: |
        set -euo pipefail

        # Create secure temporary file
        TMP_FILE=$(mktemp)
        trap 'rm -f "$TMP_FILE"' EXIT

        # Download with proper error handling and retry logic
        if ! curl -fsSL --retry 3 --retry-delay 2 "${{ inputs.url }}" -o "$TMP_FILE"; then
          echo "::error::Failed to download JSON file from ${{ inputs.url }}"
          exit 1
        fi

        # Validate JSON and extract property
        if ! jq -e . "$TMP_FILE" >/dev/null 2>&1; then
          echo "::error::Downloaded file is not valid JSON"
          exit 1
        fi

        VALUE=$(jq -r '.${{ inputs.property }}' "$TMP_FILE")
        if [ "$VALUE" = "null" ]; then
          echo "::warning::Property '${{ inputs.property }}' not found in JSON or is null"
        fi

        echo "value=$VALUE" >> $GITHUB_OUTPUT